<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — project board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔨</text></svg>">
<style>
  :root {
    --ground:#EEF1F5; --surface:#FFF; --sunken:#E3E8EF; --line:#D3DAE3;
    --ink:#161B22; --muted:#5C6774; --faint:#8894A3; --accent:#2E6F8E;
    --done:#23815076; --done-ink:#1C6B44; --active:#1FA76A; --pending:#B8690F;
    --chat-you:#2E8B70; --chat-you-ink:#1F5E4B;
    --shadow:0 1px 2px rgba(22,27,34,.06), 0 8px 24px -12px rgba(22,27,34,.18);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0E1218; --surface:#161C25; --sunken:#1D242F; --line:#29323F;
      --ink:#DFE6EF; --muted:#94A1B2; --faint:#6B7889; --accent:#5FA8CC;
      --done:#2E8B5E80; --done-ink:#4FBE87; --active:#34D399; --pending:#E0913C;
      --chat-you:#5FC2A0; --chat-you-ink:#8FDCC2;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
         line-height:1.5; -webkit-font-smoothing:antialiased; }
  .page { max-width:1240px; margin:0 auto; padding:0 20px 40px; }

  /* Three stacked rows: brand, then the project and what you can do to it,
     then what it is doing right now. */
  /* Frozen: the project, its spend and the build controls stay reachable at any
     scroll position. --header-h is measured in script, since the header is shorter
     before a project is planned. */
  .topbar { position:sticky; top:0; z-index:30; background:var(--ground);
            display:flex; flex-direction:column; gap:10px;
            padding:24px 0 18px; border-bottom:2px solid var(--line); margin-bottom:22px; }
  .brand { font-family:var(--mono); font-size:.68rem; letter-spacing:.18em;
           text-transform:uppercase; color:var(--faint); }
  .titlerow { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px 16px; }
  .titlerow .grandtotal { margin-left:auto; }
  .statusrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .project { font-size:1.9rem; font-weight:640; letter-spacing:-.02em; margin:0; }
  /* The title and the switcher are one control: the <select> sits invisibly over the
     name, so there is exactly one place the project is named. */
  .projwrap { position:relative; display:inline-flex; align-items:baseline; gap:6px; }
  .projwrap .caret { font-size:.8rem; color:var(--faint); }
  .projwrap select { position:absolute; inset:0; width:100%; height:100%;
                     opacity:0; cursor:pointer; font-size:1rem; }
  .projwrap:hover .project { text-decoration:underline; text-decoration-color:var(--line);
                             text-underline-offset:5px; }
  .projwrap.single .caret, .projwrap.single select { display:none; }
  .runpill { font-family:var(--mono); font-size:.7rem; letter-spacing:.06em; padding:3px 10px;
             border-radius:999px; background:color-mix(in srgb, var(--active) 16%, transparent);
             color:var(--active); border:1px solid color-mix(in srgb, var(--active) 40%, transparent); }
  .runpill[data-state="planning"], .runpill[data-state="paused"],
  .runpill[data-state="needs your input"] {
             background:color-mix(in srgb, var(--pending) 16%, transparent);
             color:var(--pending); border-color:color-mix(in srgb, var(--pending) 40%, transparent); }
  .runpill[data-state="needs your input"] { animation:pulse 1.5s ease-in-out infinite; }
  .grandtotal { text-align:right; }
  .grandtotal .n { font-family:var(--mono); font-size:1.9rem; font-weight:600;
                   font-variant-numeric:tabular-nums; letter-spacing:-.02em; display:block; }
  .grandtotal .l { font-family:var(--mono); font-size:.62rem; letter-spacing:.16em;
                   text-transform:uppercase; color:var(--faint); }

  .grid { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:20px; align-items:start; }

  /* Three page modes. `new` is the create form on its own, `landing` is the
     conversation on its own, `board` is the plan beside it. Only the third has
     two columns; the first two are one centred reading column. */
  .newpane { max-width:34rem; margin:8vh auto 0; padding:26px 28px 22px; }
  .newpane h2 { margin:0 0 18px; font-size:1.25rem; letter-spacing:-.01em; }
  .page:not(.mode-new) .newpane { display:none; }
  .page.mode-new .grid, .page.mode-landing .grid { display:block; }
  .page.mode-new .rail, .page.mode-landing .rail,
  .page.mode-new .chat { display:none; }
  .page.mode-new .grandtotal, .page.mode-landing .grandtotal,
  .page.mode-new .statusrow, .page.mode-landing .statusrow { display:none; }
  .page.mode-new .projwrap, .page.mode-new #newProject { visibility:hidden; }

  /* Landing: the greeting and a prompt box, nothing else on the page. */
  .page.mode-landing .chat { max-width:46rem; margin:6vh auto 0; position:static;
                             height:auto; min-height:66vh; border:0; background:transparent;
                             box-shadow:none; }
  .page.mode-landing .chat > .card-head { display:none; }
  .page.mode-landing .thread { padding:0 4px 20px; }
  .page.mode-landing .msg { max-width:100%; font-size:1rem; }
  .page.mode-landing .composer { border:1px solid var(--line); border-radius:14px;
                                 background:var(--surface); padding:10px; box-shadow:var(--shadow);
                                 align-items:flex-end; }
  .page.mode-landing .composer textarea { border:0; background:transparent; min-height:4.5rem;
                                          font-size:1rem; padding:8px 6px; }
  .page.mode-landing .composer textarea:focus-visible { outline:none; }

  /* Approving the spec is the moment the board appears: the plan fades in from the
     left and the conversation settles into its column. Runs once, on the flip. */
  @keyframes pane-in { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:none; } }
  @keyframes chat-settle { from { transform:translateX(-6%); } to { transform:none; } }
  .page.just-planned .rail { animation:pane-in .45s cubic-bezier(.2,0,.13,1) both; }
  .page.just-planned .chat { animation:chat-settle .45s cubic-bezier(.2,0,.13,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .page.just-planned .rail, .page.just-planned .chat { animation:none; }
  }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  .rail { display:flex; flex-direction:column; gap:20px; min-width:0; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px;
          box-shadow:var(--shadow); overflow:hidden; }
  .card-head { display:flex; align-items:center; gap:10px; padding:13px 16px;
               border-bottom:1px solid var(--line); background:var(--sunken); }
  .card-head h2 { margin:0; font-family:var(--mono); font-size:.7rem; letter-spacing:.16em;
                  text-transform:uppercase; color:var(--muted); font-weight:600; }
  .card-head .sub { margin-left:auto; font-family:var(--mono); font-size:.68rem;
                    color:var(--faint); font-variant-numeric:tabular-nums; }

  .row { display:grid; grid-template-columns:14px minmax(0,1fr) auto; align-items:center;
         gap:12px; padding:11px 16px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.92rem; }
  .row .cost { font-family:var(--mono); font-size:.88rem; font-variant-numeric:tabular-nums; }
  .row .cost.none { color:var(--faint); }
  .dot { width:10px; height:10px; border-radius:50%; justify-self:center; }
  .st-done .dot { background:var(--done-ink); }
  .st-active .dot { background:var(--active); animation:pulse 1.5s ease-in-out infinite; }
  .ms.st-done .dot { background:var(--done-ink); }
  .ms.st-pending .dot { background:transparent; border:2px solid var(--pending); }
  .st-pending .dot { background:transparent; border:2px solid var(--pending); }
  .st-done { background:color-mix(in srgb, var(--done) 22%, transparent); }
  .st-active { background:color-mix(in srgb, var(--active) 12%, transparent);
               box-shadow:inset 3px 0 0 var(--active); }
  .st-pending { box-shadow:inset 3px 0 0 color-mix(in srgb, var(--pending) 55%, transparent); }
  @keyframes pulse {
    0%,100% { opacity:1; box-shadow:0 0 0 0 color-mix(in srgb, var(--active) 55%, transparent); }
    50% { opacity:.55; box-shadow:0 0 0 5px color-mix(in srgb, var(--active) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .st-active .dot { animation:none; outline:2px solid var(--active); outline-offset:2px; }
  }
  /* A milestone heading, and the tasks filed under it one indent in. */
  .ms { display:grid; grid-template-columns:14px minmax(0,1fr) auto; align-items:center;
        gap:12px; padding:12px 16px 8px; font-weight:640; }
  .ms .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ms .cost { font-family:var(--mono); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .ms .cost.none { color:var(--faint); }
  .row.sub { padding-left:38px; border-bottom:0; }
  .row.sub .name { font-size:.88rem; color:var(--muted); }
  .row.sub.st-active .name { color:var(--ink); }
  .row.sub.empty .name { color:var(--faint); font-style:italic; }

  .row-total { display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:12px; padding:12px 16px;
               border-top:2px solid var(--line); background:var(--sunken); font-weight:620; }
  .row-total .name { font-family:var(--mono); font-size:.7rem; letter-spacing:.14em;
                     text-transform:uppercase; color:var(--muted); }
  .row-total .cost { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:.95rem; }

  .agents { padding:6px 16px 14px; display:flex; flex-direction:column; }
  .agent { display:grid; grid-template-columns:92px minmax(0,1fr) 72px; align-items:center;
           gap:12px; padding:8px 0; }
  .agent .who { font-family:var(--mono); font-size:.78rem; letter-spacing:.04em; color:var(--muted); }
  .agent .track { height:9px; background:var(--sunken); border-radius:3px; overflow:hidden; }
  /* display:block matters: an inline span ignores width and height, which renders every
     bar as an empty track of identical length. */
  .agent .fill { display:block; height:100%; min-width:2px; background:var(--accent);
                 border-radius:3px; transition:width .4s ease; }
  .agent .amt { font-family:var(--mono); font-size:.85rem; font-variant-numeric:tabular-nums; text-align:right; }

  .chat { position:sticky; top:calc(var(--header-h, 140px) + 16px); display:flex; flex-direction:column; height:min(78vh,760px); }
  @media (max-width:900px) { .chat { position:static; height:560px; } }
  .thread { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; font-size:.9rem; }
  .msg .who { font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
              color:var(--faint); display:block; margin-bottom:4px; }
  /* Two speakers, two hues: Iris a hint of blue, the client a muted sea green. The panel
     behind them is --surface, so both are tints mixed toward it rather than flat fills.
     The green is deliberately muted — the board already spends vivid green on "done", and
     a bright bubble would read as a status rather than as a person. */
  .msg .bubble { padding:9px 12px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word;
                 background:color-mix(in srgb, var(--accent) 10%, var(--surface));
                 border:1px solid color-mix(in srgb, var(--accent) 24%, transparent); }
  .msg.you { align-self:flex-end; }
  .msg.you .who { text-align:right; color:var(--chat-you-ink); }
  .msg.you .bubble { background:color-mix(in srgb, var(--chat-you) 28%, var(--surface));
                     border-color:color-mix(in srgb, var(--chat-you) 55%, transparent); }
  .thinking { font-family:var(--mono); font-size:.72rem; color:var(--faint); padding:0 16px 10px; }
  .thinking span { animation:blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
  .approve { border-top:1px solid var(--line); padding:12px 16px 14px;
             background:color-mix(in srgb, var(--active) 8%, var(--sunken)); }
  .approve .ask { margin:0 0 10px; font-size:.9rem; }
  .approve .row { display:flex; gap:8px; flex-wrap:wrap; }
  .approve.needs { background:color-mix(in srgb, var(--pending) 12%, var(--sunken));
                   box-shadow:inset 3px 0 0 var(--pending); }
  .approve.needs .ask { margin:0 0 4px; color:var(--pending); }
  .approve.needs .sub { margin:0; font-size:.8rem; color:var(--faint); }
  .card.ready { box-shadow:inset 3px 0 0 var(--active); }
  .readybody { padding:4px 16px 14px; }
  .readybody .l { margin:10px 0 4px; font-family:var(--mono); font-size:.62rem;
                  letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .readybody code { display:block; font-family:var(--mono); font-size:.82rem;
                    background:var(--sunken); border:1px solid var(--line); border-radius:6px;
                    padding:8px 10px; overflow-x:auto; white-space:pre; user-select:all; }
  .composer { border-top:1px solid var(--line); padding:12px; display:flex; gap:8px; background:var(--sunken); }
  .composer textarea { flex:1; min-width:0; font:inherit; font-size:.9rem; color:var(--ink); resize:none;
                       background:var(--surface); border:1px solid var(--line); border-radius:8px;
                       padding:9px 12px; line-height:1.45; max-height:40vh; }
  .composer button { font-family:var(--mono); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase;
                     background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; cursor:pointer; }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  :is(input,button):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .placeholder { padding:26px 16px; text-align:center; color:var(--faint); }
  .placeholder .bar { height:11px; border-radius:4px; background:var(--sunken); margin:9px auto; }
  .placeholder p { font-size:.82rem; margin:16px 0 0; }
  .err { margin:0; padding:10px 16px; font-size:.8rem; color:#fff;
         background:color-mix(in srgb, #C0392B 82%, black); }
  .offline { position:fixed; bottom:14px; right:14px; font-family:var(--mono); font-size:.7rem;
             background:var(--pending); color:#fff; padding:6px 12px; border-radius:7px; }
  .hidden { display:none !important; }

  /* project switcher + actions */
  select, .btn { font-family:var(--mono); font-size:.72rem; letter-spacing:.06em;
                 border:1px solid var(--line); border-radius:7px; padding:6px 10px;
                 background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; border-color:transparent; }
  .btn.stop { background:var(--pending); color:#fff; border-color:transparent; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  /* budget strip */
  .budget { display:flex; align-items:baseline; gap:8px; justify-content:flex-end;
            font-family:var(--mono); font-size:.68rem; color:var(--faint); }
  .budget b { color:var(--ink); font-weight:600; }
  .budget.over b { color:var(--pending); }

  /* spec panel — the whole card folds, and so does each section inside it */
  details.speccard > summary { list-style:none; cursor:pointer; }
  details.speccard > summary::-webkit-details-marker { display:none; }
  details.speccard > summary .chev { font-size:1rem; line-height:1; color:var(--muted);
                                     transition:transform .15s; display:inline-block; }
  details.speccard[open] > summary .chev { transform:rotate(90deg); }
  details.speccard > summary:hover h2, details.speccard > summary:hover .chev { color:var(--active); }

  details.spec { border-top:1px solid var(--line); }
  details.spec > summary { padding:11px 16px; cursor:pointer; font-size:.92rem; list-style:none;
                           display:flex; align-items:center; gap:10px; }
  details.spec > summary::-webkit-details-marker { display:none; }
  details.spec > summary:hover { background:var(--sunken); }
  /* Big enough to read as a control: at .72rem it looked like a bullet, and the
     sections read as plain text nobody would think to click. */
  details.spec > summary .chev { font-size:1.05rem; line-height:1; width:14px; text-align:center;
                                 color:var(--accent); transition:transform .15s; display:inline-block; }
  details.spec[open] > summary .chev { transform:rotate(90deg); }
  .specbody { padding:4px 20px 18px; font-size:.88rem; max-width:70ch; }
  .specbody h1,.specbody h2,.specbody h3 { font-size:1rem; margin:16px 0 6px; }
  .specbody h1 { font-size:1.1rem; }
  .specbody ul { padding-left:20px; margin:6px 0; }
  .specbody code { font-family:var(--mono); font-size:.85em; background:var(--sunken);
                   padding:1px 4px; border-radius:4px; }
  .specbody p { margin:6px 0; }

  /* The review dialog and the create page share one form treatment. */
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--surface);
           color:var(--ink); padding:0; box-shadow:var(--shadow); width:min(420px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  :is(dialog, .newpane) form { display:flex; flex-direction:column; gap:14px; }
  dialog form { padding:20px; }
  :is(dialog, .newpane) h2 { margin:0; font-size:1.15rem; }
  :is(dialog, .newpane) label { display:flex; flex-direction:column; gap:5px; font-family:var(--mono);
                 font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  :is(dialog, .newpane) :is(input, select) { font-family:var(--sans); font-size:.92rem; text-transform:none;
                letter-spacing:normal; padding:9px 11px; border:1px solid var(--line);
                border-radius:8px; background:var(--ground); color:var(--ink); }
  :is(dialog, .newpane) .hint { font-family:var(--sans); font-size:.74rem; color:var(--faint);
                 text-transform:none; letter-spacing:normal; }
  :is(dialog, .newpane) .row { display:flex; gap:10px; justify-content:flex-end; }
  :is(dialog, .newpane) .err { border-radius:8px; }

  /* review dialog — wider than the create form, since it holds the whole draft */
  dialog.review { width:min(760px,94vw); }
  .review .head { padding:20px 22px 14px; border-bottom:1px solid var(--line); }
  .review .head h2 { margin:0 0 4px; }
  .review .head .sub { margin:0; font-size:.82rem; color:var(--muted); }
  .review .body { padding:16px 22px 20px; max-height:min(62vh,620px); overflow-y:auto;
                  font-size:.9rem; max-width:none; }
  .review .body h3 { margin:18px 0 6px; font-size:.95rem; }
  .review .body h3:first-child { margin-top:0; }
  .review .foot { padding:14px 22px 18px; border-top:1px solid var(--line);
                  display:flex; gap:10px; justify-content:flex-end; }
  .review .objective { margin:0 0 4px; }
  .review .accept { margin:0; color:var(--muted); font-size:.86rem; }
  /* A change reads as two short lists: what the product no longer does, then what it does now. */
  .review .l { margin:12px 0 4px; font-family:var(--mono); font-size:.62rem;
               letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .review ul.al, .review ul.dl { margin:0; padding-left:18px; font-size:.88rem; }
  .review ul.al li { margin:3px 0; }
  .review ul.dl li { margin:3px 0; color:var(--muted); text-decoration:line-through; }
  /* The theme picker. The tiles carry the themes' own tokens, so everything here is
     described in those variables and nothing hardcodes a colour. */
  .theme .knobs { display:flex; flex-wrap:wrap; gap:14px; padding:12px 22px;
                  border-bottom:1px solid var(--line); font-size:.8rem; color:var(--muted); }
  .theme .knobs label { display:flex; align-items:center; gap:6px; }
  .theme .knobs select { font:inherit; padding:3px 6px; border:1px solid var(--line);
                         border-radius:6px; background:var(--panel); color:var(--ink); }
  .theme .foot .note { margin-right:auto; font-size:.8rem; color:var(--muted); }
  .tile { display:block; width:100%; text-align:left; margin:0 0 12px; padding:0; cursor:pointer;
          border:2px solid var(--line); border-radius:12px; overflow:hidden; background:none;
          font:inherit; }
  .tile:hover { border-color:var(--active); }
  .tile.on { border-color:var(--active); box-shadow:0 0 0 3px color-mix(in oklab, var(--active) 22%, transparent); }
  .tile .paint { padding:14px 16px; background:var(--fg-canvas); color:var(--fg-ink);
                 font-family:var(--fg-font-sans); }
  .tile .name { display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
                font-weight:var(--fg-heading-weight); letter-spacing:var(--fg-heading-tracking); }
  .tile .name em { font-style:normal; font-size:.8rem; font-weight:400; color:var(--fg-ink-muted); }
  .tile .demo { display:flex; gap:10px; align-items:center; }
  .tile .card { flex:1; background:var(--fg-surface); border:1px solid var(--fg-border);
                border-radius:calc(8px * var(--fg-radius-base)); padding:9px 11px; font-size:.82rem; }
  .tile .card .sub { color:var(--fg-ink-muted); font-size:.75rem; margin-top:3px; }
  .tile .cta { background:oklch(var(--fg-accent-l) var(--fg-accent-c) var(--fg-accent-h));
               color:var(--fg-on-accent); border-radius:calc(7px * var(--fg-radius-base));
               padding:7px 13px; font-size:.8rem; }
  .tile .chip { background:var(--fg-surface-sunken); border:1px solid var(--fg-border);
                border-radius:999px; padding:5px 10px; font-size:.75rem; color:var(--fg-ink-muted); }
  .tile .current { margin-left:auto; font-size:.72rem; color:var(--fg-ink-faint); }

  /* The UI theme card: the look the project is built with, and one click to change it.
     The swatches are painted by the theme's own tokens, injected into #themeRowStyles. */
  .themerow { display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px;
              background:none; border:0; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .themerow:hover { background:var(--sunken); }
  .themerow .swatches { display:inline-flex; gap:4px; }
  .themerow .sw { width:16px; height:16px; border-radius:4px; border:1px solid var(--line); }
  .themerow .sw-canvas { background:var(--fg-canvas, var(--sunken)); }
  .themerow .sw-surface { background:var(--fg-surface, var(--surface)); }
  .themerow .sw-ink { background:var(--fg-ink, var(--ink)); }
  .themerow .sw-accent { background:oklch(var(--fg-accent-l, .6) var(--fg-accent-c, .14) var(--fg-accent-h, 240)); }
  .themerow .which { font-size:.9rem; }
  .themerow .change { margin-left:auto; font-family:var(--mono); font-size:.68rem;
                      letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }

  /* The chain of changes in the rail: one folded entry per accepted change request. */
  .crrow { padding:9px 16px; border-top:1px solid var(--line); font-size:.86rem;
           display:flex; gap:10px; align-items:baseline; }
  .crrow .n { font-family:var(--mono); font-size:.7rem; color:var(--muted); }
  .crrow .pending { margin-left:auto; font-size:.7rem; color:var(--active); }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <span class="brand">Forge</span>
    <div class="titlerow">
      <!-- The project name IS the switcher: one place shows which project you are on. -->
      <div class="projwrap">
        <h1 class="project" id="projName">…</h1>
        <span class="caret" id="projCaret" aria-hidden="true">▾</span>
        <select id="projPicker" aria-label="Switch project"></select>
      </div>
      <button class="btn" id="newProject">+ New project</button>
      <div class="grandtotal">
        <span class="n" id="grandTotal">$0.00</span>
        <span class="l">total spend</span>
        <div class="budget hidden" id="budgetStrip">
          <span id="budgetText"></span>
          <button class="btn" id="raiseBudget">Raise</button>
        </div>
      </div>
    </div>
    <div class="statusrow">
      <span class="runpill" id="runPill">● …</span>
      <button class="btn primary hidden" id="resumeBtn">Resume build</button>
      <button class="btn stop hidden" id="stopBtn">Pause build</button>
    </div>
  </header>

  <div class="grid">

    <!-- Starting a project is a page of its own, not a dialog over somebody else's board. -->
    <section class="newpane card" id="newPane">
      <form id="newForm">
        <h2>Start a new project</h2>
        <label>Project name
          <input id="npName" required placeholder="weatherboard" autocomplete="off">
          <span class="hint">Letters, digits, hyphen and underscore — it becomes the folder name.</span>
        </label>
        <label>Budget
          <input id="npBudget" type="number" min="1" step="1" value="25" required>
          <span class="hint">A hard cap in US dollars. You can raise it later.</span>
        </label>
        <label>Model provider
          <select id="npProvider"></select>
          <span class="hint">Needs that provider's key in ~/forge_env.</span>
        </label>
        <p class="err hidden" id="npErr"></p>
        <div class="row">
          <button class="btn" id="npCancel" type="button">Cancel</button>
          <button class="btn primary" id="npGo">Go</button>
        </div>
      </form>
    </section>
    <main class="rail" id="rail"></main>

    <aside class="card chat">
      <div class="card-head">
        <h2 id="agentHead">…</h2>
      </div>
      <div class="thread" id="thread"></div>
      <p class="thinking hidden" id="thinking"><span id="thinkingWho">…</span> is replying<span>…</span></p>
      <!-- The build has stopped on something only the client can decide. -->
      <div class="approve needs hidden" id="needsBar">
        <p class="ask"><b id="needsTitle"></b></p>
        <p class="sub" id="needsDetail"></p>
      </div>
      <!-- A draft waiting to be read. Approving happens inside the review dialog, and
           nothing about the proposal reaches the page until the client approves it. -->
      <div class="approve hidden" id="approveBar">
        <p class="ask"><b id="approveTitle"></b> is ready for you to read.</p>
        <div class="row">
          <button class="btn primary" id="reviewBtn">Review proposal</button>
        </div>
      </div>
      <p class="err hidden" id="chatErr"></p>
      <form class="composer" id="composer">
        <textarea id="msg" rows="1" placeholder="Message…" aria-label="Message"></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </aside>
  </div>
</div>
<div class="offline hidden" id="offline">board offline — retrying</div>

<dialog id="reviewDialog" class="review">
  <div class="head">
    <h2 id="reviewHead">Draft proposal</h2>
    <p class="sub" id="reviewSub"></p>
  </div>
  <div class="body specbody" id="reviewBody"></div>
  <div class="foot">
    <button class="btn" id="keepBtn">Keep chatting</button>
    <button class="btn primary" id="approveBtn">Approve &amp; start building</button>
  </div>
</dialog>

<!-- The theme picker. Every tile is drawn with the theme's own tokens, so what the client
     sees here is what their application gets. Choosing installs it straight away. -->
<dialog id="themeDialog" class="review theme">
  <div class="head">
    <h2>Choose how it looks</h2>
    <p class="sub">Every theme below is ready to use. Pick one and it is applied straight
       away — you can change it whenever you like.</p>
  </div>
  <div class="knobs">
    <label>Light or dark <select id="themeMode"></select></label>
    <label>Accent <select id="themeAccent"></select></label>
    <label>Spacing <select id="themeDensity"></select></label>
    <label>Corners <select id="themeRadius"></select></label>
  </div>
  <div class="body" id="themeTiles"></div>
  <div class="foot">
    <span class="note" id="themeNote"></span>
    <button class="btn" id="themeClose">Close</button>
    <button class="btn primary" id="themeApply" disabled>Apply</button>
  </div>
</dialog>
<style id="themeTileStyles"></style>
<style id="themeRowStyles"></style>


<script>
const $ = id => document.getElementById(id);
const usd = n => '$' + Number(n || 0).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// The ledger stores roles snake_case; "Pm" and "Qa" are not how anyone writes them.
// pm resolves to the client-facing name instead: they are told who Iris is, never
// what the role behind her is called.
const ROLE = { qa:'QA', principal:'Principal', engineer:'Engineer', researcher:'Researcher' };
const roleName = r => (r === 'pm' ? (agentName || 'PM') : ROLE[r] || r);

let lastChatId = 0, sending = false;
// The newest snapshot, so the review dialog can render without waiting for a poll.
let lastBoard = null;
let project = decodeURIComponent(location.hash.slice(1)) || null;
let providers = [];
// The rail is re-rendered every poll; without these the spec — the card and each
// section inside it — would snap shut every 3s while the client was reading it.
let specOpen = false;
const openSections = new Set();
// The draft the client put away with "Keep chatting". Identified by its content, so a
// proposal Iris revises is a different draft and asks to be read again. Per project and
// per tab, in sessionStorage, so a reload does not re-raise a prompt already dismissed.
function dismissKey() { return `forge.dismissed.${project}`; }
let dismissedProposal = sessionStorage.getItem(dismissKey());
// Whether this tab has already opened the picker for the offer currently standing.
let themeOfferSeen = false;
const proposalKey = p => `${p.title}\n${p.objective}\n${p.acceptance || ''}\n${p.changeEntry || ''}`;
// Whatever the server says the client-facing agent is called. One constant, server-side.
let agentName = '';

// A client who wandered off is looking at a tab strip, not at this page. The title
// and the favicon are the only surfaces that reach them there, so both carry the
// "you are being waited on" state and both revert the moment it clears.
const baseTitle = document.title;
let attentionShown = null;

function flagAttention(needed, projectName) {
  if (attentionShown === needed) return;
  attentionShown = needed;
  document.title = needed ? `● input needed — ${projectName}` : baseTitle;
  setFavicon(needed);
}

function setFavicon(needed) {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  g.fillStyle = '#1FA76A';
  g.beginPath(); g.arc(16, 16, 13, 0, 7); g.fill();
  if (needed) {
    g.fillStyle = '#E0913C';
    g.beginPath(); g.arc(24, 8, 8, 0, 7); g.fill();
  }
  let link = document.querySelector("link[rel='icon']");
  if (!link) {
    link = document.createElement('link');
    link.rel = 'icon';
    document.head.appendChild(link);
  }
  link.href = c.toDataURL('image/png');
}

// Which of the three layouts the page is in. `board` arrives only when the client has
// approved something to build, and the animation fires on that one transition.
let creating = false;
let wasPlanned = null;

// The header's height, published for whatever has to sit clear of it.
function measureHeader() {
  const bar = document.querySelector('.topbar');
  if (bar) document.documentElement.style.setProperty('--header-h', `${bar.offsetHeight}px`);
}
window.addEventListener('resize', measureHeader);

function setMode(mode) {
  const page = document.querySelector('.page');
  for (const m of ['mode-new', 'mode-landing', 'mode-board']) page.classList.toggle(m, m === `mode-${mode}`);
  if (mode !== 'board') { page.classList.remove('just-planned'); wasPlanned = null; }
}

function showBoardMode(planned) {
  setMode(planned ? 'board' : 'landing');
  if (planned && wasPlanned === false) {
    const page = document.querySelector('.page');
    page.classList.add('just-planned');
    setTimeout(() => page.classList.remove('just-planned'), 600);
  }
  wasPlanned = planned;
}

function selectProject(name) {
  project = name;
  location.hash = encodeURIComponent(name);
  lastChatId = 0;                       // force a chat repaint for the new project
  // Each project has its own dismissed draft; switching must not carry one across.
  dismissedProposal = sessionStorage.getItem(dismissKey());
  $('thread').innerHTML = '';
  poll();
}

/* A deliberately small markdown subset — the spec is PM-authored prose: headings,
   lists, emphasis, inline code. Escaped first, so nothing in the document can inject
   markup. Not a general renderer, and does not need to be. */
function markdown(src) {
  const lines = esc(src).split('\n');
  let html = '', inList = false;
  const inline = t => t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  for (const line of lines) {
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (h) { const n = Math.min(h[1].length + 1, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; }
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

function rows(items) {
  return items.map(i => `
    <div class="row st-${esc(i.state)}">
      <span class="dot"></span>
      <span class="name" title="${esc(i.name)}">${esc(i.name)}</span>
      <span class="cost${i.costUsd > 0 ? '' : ' none'}">${i.costUsd > 0 ? usd(i.costUsd) : '—'}</span>
    </div>`).join('');
}

function section(title, sub, body, total) {
  return `<section class="card">
    <div class="card-head"><h2>${esc(title)}</h2><span class="sub">${esc(sub)}</span></div>
    ${body}
    ${total ? `<div class="row-total"><span></span><span class="name">${esc(total.label)}</span>
       <span class="cost">${usd(total.value)}</span></div>` : ''}
  </section>`;
}

function renderRail(d) {
  if (!d.planned) {
    $('rail').innerHTML = `<section class="card">
      <div class="card-head"><h2>Not planned yet</h2></div>
      <div class="placeholder">
        <div class="bar" style="width:62%"></div><div class="bar" style="width:44%"></div>
        <div class="bar" style="width:53%"></div>
        <p>Your requirements and progress appear here once you approve what you and
           ${esc(agentName)} agree on. Until then, the conversation is the whole page.</p>
      </div></section>`;
    return;
  }

  let html = '';

  if (d.specReady && d.spec.length) {
    // Folded by default once the build is under way; the client reads the detail in
    // the review dialog before approving.
    const open = specOpen ? ' open' : '';
    html += `<section class="card">
      <details class="speccard" id="specCard"${open}>
        <summary><div class="card-head"><h2><span class="chev">▸</span> Specification</h2>
          <span class="sub">${d.spec.length} section${d.spec.length === 1 ? '' : 's'}</span></div></summary>
        ${d.spec.map(sec => `<details class="spec" data-title="${esc(sec.title)}"${
            openSections.has(sec.title) ? ' open' : ''}><summary><span class="chev">▸</span>
          ${esc(sec.title)}</summary>
          <div class="specbody">${markdown(sec.markdown)}</div></details>`).join('')}
      </details>
    </section>`;
  }

  // Directly under the specification, because it is the one part of the product the client
  // changes themselves: a theme is a selection from the kit, applied without a build.
  html += `<section class="card">
    <div class="card-head"><h2>UI theme</h2></div>
    <button class="themerow" id="themeRow">
      <span class="swatches" aria-hidden="true">${
        ['canvas', 'surface', 'ink', 'accent'].map(t => `<i class="sw sw-${t}"></i>`).join('')}</span>
      <span class="which">${esc(d.theme?.describe || 'the default look')}</span>
      <span class="change">Change</span>
    </button>
  </section>`;

  // The requirements say what the product is; this says how it got there. One row per change
  // request, oldest first, so a spec that keeps being rewritten still has a history.
  if ((d.changes || []).length) {
    html += `<section class="card"><div class="card-head"><h2>Changes</h2>
        <span class="sub">${d.changes.length}</span></div>
      ${d.changes.map(c => `<div class="crrow"><span class="n">CR-${String(c.number).padStart(3,'0')}</span>
        <span>${esc(c.title)}</span>
        ${c.approved ? '' : '<span class="pending">awaiting you</span>'}</div>`).join('')}
    </section>`;
  }

  // The chat message announcing this scrolls away; the instructions must not.
  if (d.delivery) {
    html += `<section class="card ready"><div class="card-head"><h2>Your project is ready</h2></div>
      <div class="readybody">
        <p class="l">Folder</p><code>${esc(d.delivery.directory)}</code>
        <p class="l">Run it with</p><code>${esc(d.delivery.command)}</code>
        ${d.delivery.url ? `<p class="l">Then open</p><code>${esc(d.delivery.url)}</code>` : ''}
      </div></section>`;
  }

  // Named here as well as in the chat card, so the client can see WHICH work stopped
  // and why the spend has flattened out.
  if ((d.awaitingClient || []).length) {
    html += `<section class="card"><div class="card-head"><h2>Waiting on you</h2></div>
      ${d.awaitingClient.map(t => `<div class="row st-pending">
        <span class="dot"></span>
        <span class="name" title="${esc(t.note || '')}">${esc(t.title)}</span>
        <span class="cost none">answer in chat</span>
      </div>`).join('')}</section>`;
  }

  // The whole plan: every phase in order with its work under it. The one task a worker
  // has in hand blinks, and so does the phase holding it.
  if (d.plan.length) {
    const tasks = d.plan.flatMap(m => m.tasks);
    const done = tasks.filter(t => t.state === 'done').length;
    html += section('Plan', `${done} of ${tasks.length} done`,
      d.plan.map(m => `
        <div class="ms st-${esc(m.state)}">
          <span class="dot"></span>
          <span class="name">${esc(m.name)}</span>
          <span class="cost${m.costUsd > 0 ? '' : ' none'}">${m.costUsd > 0 ? usd(m.costUsd) : '—'}</span>
        </div>
        ${m.tasks.map(t => `
          <div class="row sub st-${esc(t.state)}">
            <span class="dot"></span>
            <span class="name" title="${esc(t.name)}">${esc(t.name)}</span>
            <span class="cost${t.costUsd > 0 ? '' : ' none'}">${t.costUsd > 0 ? usd(t.costUsd) : '—'}</span>
          </div>`).join('')}
        ${m.tasks.length ? '' : '<div class="row sub empty"><span></span><span class="name">nothing yet</span><span></span></div>'}
      `).join(''),
      { label: 'Project total', value: d.totalCostUsd });
  }

  if (d.agents.length) {
    const max = Math.max(...d.agents.map(a => a.costUsd), 0.0001);
    const calls = d.agents.reduce((a, x) => a + x.calls, 0);
    html += section('Spend by agent', `${calls.toLocaleString()} calls`,
      `<div class="agents">${d.agents.map(a => `
        <div class="agent">
          <span class="who">${esc(roleName(a.role))}</span>
          <span class="track"><span class="fill" style="width:${(a.costUsd / max * 100).toFixed(1)}%"></span></span>
          <span class="amt">${usd(a.costUsd)}</span>
        </div>`).join('')}</div>`,
      { label: 'All agents', value: d.totalCostUsd });
  }
  $('rail').innerHTML = html;
  // The rail is rebuilt on every poll, so the theme row is re-bound and repainted with it.
  paintThemeRow();
  const card = $('specCard');
  if (card) card.addEventListener('toggle', () => { specOpen = card.open; });
  for (const sec of document.querySelectorAll('details.spec')) {
    sec.addEventListener('toggle', () => {
      const title = sec.dataset.title;
      sec.open ? openSections.add(title) : openSections.delete(title);
    });
  }
}

function renderChat(chat) {
  const newest = chat.length ? chat[chat.length - 1].id : 0;
  if (newest === lastChatId) return;             // nothing new; don't fight the scroll
  lastChatId = newest;
  const thread = $('thread');
  const atBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
  thread.innerHTML = chat.map(m => `
    <div class="msg ${m.from === 'client' ? 'you' : ''}">
      <span class="who">${m.from === 'client' ? 'You' : esc(agentName)}</span>
      <div class="bubble">${esc(m.text)}</div>
    </div>`).join('');
  if (atBottom) thread.scrollTop = thread.scrollHeight;
}

let lastPickerHtml = '';
async function refreshProjects() {
  const r = await fetch('/api/projects');
  const d = await r.json();
  providers = d.providers;
  const picker = $('projPicker');
  // Name only: the status pill already says what this project is doing, and the
  // name must read the same here as it does in the title it sits on top of.
  const html = d.projects.map(p =>
    `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  // Rebuilding the options collapses an open dropdown mid-choice; only touch the
  // DOM when the list really changed, and never while the user is in it.
  if (html !== lastPickerHtml && document.activeElement !== picker) {
    picker.innerHTML = html;
    lastPickerHtml = html;
  }
  document.querySelector('.projwrap').classList.toggle('single', d.projects.length < 2);

  if (!d.projects.length) {
    showEmptyState();
    // Nothing to look at and only one thing to do, so offer it rather than a bare page.
    if (!creating) { creating = true; $('newProject').click(); }
    return;
  }
  if (!project || !d.projects.some(p => p.name === project)) selectProject(d.projects[0].name);
  picker.value = project;
}

function showEmptyState() {
  project = null;
  wasPlanned = null;
  $('projName').textContent = '';
  $('runPill').classList.add('hidden');
  $('rail').innerHTML = `<section class="card"><div class="placeholder">
      <p>No projects available. Click &ldquo;+ New project&rdquo; above to start a new project.</p>
    </div></section>`;
  $('thread').innerHTML = '';
  $('composer').classList.add('hidden');
  $('approveBar').classList.add('hidden');
  if ($('reviewDialog').open) $('reviewDialog').close();
}

async function poll() {
  if (!project) return;
  try {
    const r = await fetch('/api/board?project=' + encodeURIComponent(project));
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    lastBoard = d;
    $('offline').classList.add('hidden');

    $('projName').textContent = d.project;
    $('grandTotal').textContent = usd(d.totalCostUsd);
    $('composer').classList.remove('hidden');

    // One word for what the project is doing. Approved work that nobody is executing
    // is PAUSED, not "building · idle" — the client needs to know a build has stopped.
    // Waiting on the client outranks everything: it is the only state they can clear.
    const approved = d.planned;
    const status = d.needsClient ? 'needs your input'
                 : d.building ? 'building'
                 : d.state === 'complete' ? 'complete'
                 : approved ? 'paused' : 'planning';
    flagAttention(d.needsClient, d.project);
    const pill = $('runPill');
    pill.classList.remove('hidden');
    pill.textContent = '● ' + status;
    pill.dataset.state = status;

    // No Start: a build begins by approving the requirements. What is left is
    // pausing one that is running, and resuming one that stopped.
    const otherBusy = d.worker && d.worker.project !== d.project;
    const resume = $('resumeBtn');
    resume.classList.toggle('hidden', d.building || status !== 'paused');
    resume.disabled = otherBusy || d.budgetExhausted;
    resume.title = otherBusy ? `${d.worker.project} is building — one at a time`
                 : d.budgetExhausted ? 'Budget exhausted — raise it to continue' : '';
    $('stopBtn').classList.toggle('hidden', !d.building);

    // Client-facing agent name, from the server so it lives in exactly one constant.
    if (d.agentName && d.agentName !== agentName) {
      agentName = d.agentName;
      $('agentHead').textContent = agentName;
      $('thinkingWho').textContent = agentName;
      $('msg').placeholder = `Message ${agentName}…`;
      $('msg').setAttribute('aria-label', `Message ${agentName}`);
    }

    if (!creating) showBoardMode(d.planned);
  measureHeader();

    const bar = $('approveBar');
    // Dismissed by "Keep chatting" until the draft itself changes: the client has said they
    // want to talk, not read, and the prompt returns the moment Iris proposes something new.
    bar.classList.toggle('hidden', !d.proposal || proposalKey(d.proposal) === dismissedProposal);
    if (d.proposal) {
      $('approveTitle').textContent = d.proposal.title;
      // Kept current while the dialog is open, so a proposal the PM revises mid-read
      // is not approved from a stale copy.
      if ($('reviewDialog').open) fillReview(d);
    } else if ($('reviewDialog').open) {
      $('reviewDialog').close();
    }

    // Iris has offered the picker. Opened once per offer; choosing clears the flag server-side,
    // and closing without choosing leaves the Appearance button as the way back in.
    if (d.themeOffered && !themeOfferSeen) {
      themeOfferSeen = true;
      openThemePicker();
    } else if (!d.themeOffered) {
      themeOfferSeen = false;
    }

    // A flag, not an explanation: it names what is stuck and points at the chat,
    // where the agent has put what it actually needs in the client's own terms.
    const waiting = d.awaitingClient || [];
    $('needsBar').classList.toggle('hidden', waiting.length === 0);
    if (waiting.length) {
      $('needsTitle').textContent = waiting.length === 1
        ? `${agentName} needs your input to carry on.`
        : `${agentName} needs your input on ${waiting.length} things to carry on.`;
      $('needsDetail').textContent = waiting.map(t => t.title).join(' · ');
    }

    const strip = $('budgetStrip');
    strip.classList.toggle('hidden', d.budgetUsd == null);
    strip.classList.toggle('over', !!d.budgetExhausted);
    if (d.budgetUsd != null) {
      $('budgetText').innerHTML = d.budgetExhausted
        ? `budget of <b>${usd(d.budgetUsd)}</b> exhausted`
        : `<b>${usd(d.budgetRemainingUsd)}</b> left of ${usd(d.budgetUsd)}`;
    }

    renderRail(d);
    renderChat(d.chat);

    $('thinking').classList.toggle('hidden', !d.pmBusy);
    $('send').disabled = d.pmBusy || sending;
    const problem = d.pmError || d.runError;
    $('chatErr').classList.toggle('hidden', !problem);
    if (problem) $('chatErr').textContent = problem;
  } catch {
    $('offline').classList.remove('hidden');
  }
}

$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const input = $('msg');
  const text = input.value.trim();
  if (!text || sending) return;

  sending = true; $('send').disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project, message: text }),
    });
    if (r.ok) { input.value = ''; $('thinking').classList.remove('hidden'); }
    else {
      const body = await r.json().catch(() => ({}));
      $('chatErr').textContent = body.error || 'Could not send that message.';
      $('chatErr').classList.remove('hidden');
    }
  } finally {
    sending = false;
    poll();
  }
});

$('projPicker').addEventListener('change', e => selectProject(e.target.value));

$('newProject').addEventListener('click', () => {
  $('npProvider').innerHTML = providers.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  $('npErr').classList.add('hidden');
  $('npName').value = '';
  creating = true;
  setMode('new');
  $('npName').focus();
});

$('npCancel').addEventListener('click', () => {
  creating = false;
  if (project) poll(); else refreshProjects();
});

$('newForm').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    name: $('npName').value.trim(),
    budgetUsd: Number($('npBudget').value),
    provider: $('npProvider').value,
  };
  const r = await fetch('/api/projects', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    $('npErr').textContent = err.error || 'Could not create that project.';
    $('npErr').classList.remove('hidden');
    return;
  }
  creating = false;
  await refreshProjects();
  selectProject(body.name);
  $('msg').focus();
});

$('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
});
$('msg').addEventListener('input', () => {
  const box = $('msg');
  box.style.height = 'auto';
  box.style.height = `${box.scrollHeight}px`;
});

$('raiseBudget').addEventListener('click', async () => {
  const next = prompt('New budget in US dollars:');
  if (!next) return;
  await fetch('/api/budget', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project, budgetUsd: Number(next) }),
  });
  poll();
});

for (const [id, action] of [['resumeBtn', 'start'], ['stopBtn', 'stop']]) {
  $(id).addEventListener('click', async () => {
    const r = await fetch('/api/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project, action }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      $('chatErr').textContent = err.error || 'Could not change the build state.';
      $('chatErr').classList.remove('hidden');
    }
    poll();
  });
}

// The draft. A first build shows the whole specification, because all of it is new; a change
// to a built product shows only what the change does to it — the client has read the rest.
function fillReview(d) {
  const p = d.proposal;
  if (!p) return;
  const changes = d.specChanges || [];
  $('reviewHead').textContent = p.title;
  $('reviewSub').textContent = changes.length
    ? `A change to what you have. Proposed by ${agentName}; nothing is built until you approve.`
    : `Proposed by ${agentName}. Nothing is built until you approve.`;

  const detail = changes.length
    ? changes.map(c => `<h3>${esc(c.file)}</h3>
        ${c.removed.length ? `<p class="l">No longer</p><ul class="dl">${
          c.removed.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
        ${c.added.length ? `<p class="l">Now</p><ul class="al">${
          c.added.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}`).join('')
    : d.spec.filter(s => s.file.toLowerCase() !== 'index.md')
        .map(s => `<h3>${esc(s.title)}</h3>${markdown(s.markdown)}`).join('');

  $('reviewBody').innerHTML = `
    <p class="objective">${esc(p.objective)}</p>
    ${p.acceptance ? `<p class="accept">${esc(p.acceptance)}</p>` : ''}
    ${detail}`;
}

$('reviewBtn').addEventListener('click', () => {
  if (lastBoard) fillReview(lastBoard);
  $('reviewDialog').showModal();
});

/* ---- the theme picker -------------------------------------------------------------
   The catalogue comes from the kit's own files: each theme's CSS is rescoped from :root
   to its tile, and the mode file is layered on top, so a tile is painted by exactly the
   declarations the project would be built with. Nothing here is generated or guessed.
   Choosing a tile only selects it; Apply is what changes the project. */
let themes = null;                       // the catalogue, fetched once and kept
let chosen = null;                       // the selection being edited in the dialog

const scopeCss = (css, selector) => css.replace(/:root/g, selector);

/// The declarations that paint one theme, in the mode and accent currently selected.
function themeCss(theme, selector, choice) {
  const mode = choice.mode === 'auto' ? 'dark' : choice.mode;
  return scopeCss(theme.css, selector) + scopeCss(themes.modeCss[mode], selector) +
    (choice.accent ? `${selector} {
        --fg-accent-h:${themes.accents[choice.accent].hue};
        --fg-accent-c:${themes.accents[choice.accent].chroma}; }` : '');
}

function paintTiles() {
  if (!themes) return;
  $('themeTileStyles').textContent = themes.themes
    .map(t => themeCss(t, `.tile[data-theme="${t.id}"] .paint`, chosen)).join('\n');

  $('themeTiles').innerHTML = themes.themes.map(t => `
    <button class="tile${t.id === chosen.theme ? ' on' : ''}" data-theme="${t.id}">
      <div class="paint">
        <div class="name">${esc(t.id)} <em>${esc(t.summary)}</em>
          ${t.id === (themes.current.theme || '') ? '<span class="current">in use</span>' : ''}</div>
        <div class="demo">
          <div class="card">A card on this theme<div class="sub">with quieter text under it</div></div>
          <span class="chip">Label</span>
          <span class="cta">Button</span>
        </div>
      </div>
    </button>`).join('');

  // A click selects, and nothing more: the project changes when Apply is pressed.
  $('themeTiles').querySelectorAll('.tile').forEach(el =>
    el.addEventListener('click', () => { chosen = { ...chosen, theme: el.dataset.theme }; paintTiles(); }));

  const changed = JSON.stringify(chosen) !== JSON.stringify(themes.current);
  $('themeApply').disabled = !changed;
  $('themeApply').textContent = changed ? `Apply ${chosen.theme}` : 'Apply';
}

function fillKnob(id, values, selected) {
  $(id).innerHTML = values.map(v =>
    `<option value="${esc(v)}"${v === selected ? ' selected' : ''}>${esc(v)}</option>`).join('');
}

/// The catalogue, fetched once per project and reused by the dialog and the rail swatches.
async function loadThemes() {
  const r = await fetch(`/api/theme?project=${encodeURIComponent(project)}`);
  themes = await r.json();
  return themes;
}

async function openThemePicker() {
  // Shown before the catalogue is fetched, so the dialog opens on the click that asked for it
  // and no tile can be selected by a mouse-up that lands after it appears.
  $('themeTiles').innerHTML = '';
  $('themeNote').textContent = 'Loading themes…';
  if (!$('themeDialog').open) $('themeDialog').showModal();

  await loadThemes();
  chosen = { ...themes.current };
  fillKnob('themeMode', themes.modes, chosen.mode);
  fillKnob('themeAccent', ['(theme default)', ...Object.keys(themes.accents)], chosen.accent || '(theme default)');
  fillKnob('themeDensity', themes.densities, chosen.density);
  fillKnob('themeRadius', themes.radii, chosen.radius);
  $('themeNote').textContent = '';
  paintTiles();
}

// Applying installs the selection into the project's interface there and then: no change
// request, no build, no conversation. A running build owns the repo, so it lands after it.
async function applyTheme() {
  $('themeApply').disabled = true;
  $('themeNote').textContent = 'Applying…';
  const r = await fetch('/api/theme', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project, ...chosen }),
  });
  const body = await r.json().catch(() => ({}));
  $('themeNote').textContent = !r.ok || body.error ? (body.error || 'Could not apply that theme.')
    : body.appliedToTrunk ? `Applied: ${body.theme}.`
    : `Saved: ${body.theme}. It goes into the app when the build finishes.`;
  if (r.ok && !body.error) themes.current = { ...chosen };
  paintTiles();
  paintThemeRow();
  poll();
}

// The knobs are part of the same selection; changing one repaints the tiles rather than
// changing the project.
for (const [id, field] of [['themeMode', 'mode'], ['themeAccent', 'accent'],
                           ['themeDensity', 'density'], ['themeRadius', 'radius']]) {
  $(id).addEventListener('change', e => {
    chosen = { ...chosen, [field]:
      field === 'accent' && e.target.value.startsWith('(') ? null : e.target.value };
    paintTiles();
  });
}

/// Paints the rail card's swatches in the project's actual theme, so the row shows the look
/// rather than only naming it. Fetches the catalogue once, then repaints from memory.
async function paintThemeRow() {
  if (!$('themeRow')) return;
  if (!themes) await loadThemes();
  $('themeRowStyles').textContent = themes.themes
    .filter(t => t.id === themes.current.theme)
    .map(t => themeCss(t, '.themerow .swatches', themes.current)).join('');
}

$('themeApply').addEventListener('click', applyTheme);

// Delegated, because the rail is rebuilt every poll: a listener bound to the row itself is
// lost with the element, and a click landing during a rebuild would do nothing.
$('rail').addEventListener('click', e => {
  if (e.target.closest('#themeRow')) openThemePicker();
});
$('themeClose').addEventListener('click', () => $('themeDialog').close());

// Keeping the conversation going puts the prompt away: the proposal stays pending, so
// approving is still possible the moment Iris raises it again, but the client is not
// asked to read the same draft twice. A revised draft has a different key and returns.
$('keepBtn').addEventListener('click', () => {
  if (lastBoard?.proposal) {
    dismissedProposal = proposalKey(lastBoard.proposal);
    sessionStorage.setItem(dismissKey(), dismissedProposal);
    $('approveBar').classList.add('hidden');
  }
  $('reviewDialog').close();
});

// Approving opens the Feature and starts the build in one step, so this is the only
// place a build begins.
$('approveBtn').addEventListener('click', async () => {
  $('approveBtn').disabled = $('keepBtn').disabled = true;
  const r = await fetch('/api/proposal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project, decision: 'approve' }),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok || body.error) {
    $('chatErr').textContent = body.error || 'Could not record your decision.';
    $('chatErr').classList.remove('hidden');
  }
  $('approveBtn').disabled = $('keepBtn').disabled = false;
  $('reviewDialog').close();
  poll();
});

refreshProjects().then(poll);
setInterval(() => { refreshProjects(); poll(); }, 3000);
</script>
</body>
</html>
